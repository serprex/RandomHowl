# Builds the plugin without the game, using NuGet references.
# Pushing a tag like v1.2.0 also publishes a GitHub release.
name: release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - run: dotnet build mod -c Release -p:NuGetRefs=true

      # Zip laid out like the game folder, so it can be extracted in place.
      - name: Package
        run: |
          mkdir -p dist/BepInEx/plugins/RandomHowl
          cp mod/bin/Release/RandomHowl.dll dist/BepInEx/plugins/RandomHowl/
          cd dist && zip -r ../RandomHowl.zip BepInEx

      - uses: actions/upload-artifact@v7
        with:
          name: RandomHowl
          path: RandomHowl.zip

      - name: Release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" RandomHowl.zip --generate-notes
